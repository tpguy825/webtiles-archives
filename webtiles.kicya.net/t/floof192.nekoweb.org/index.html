<!DOCTYPE html>
<html>
<head>
    
    
    <style>.tile-body {
  background-color: #fce4ec;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  padding: 0;
  font-family: Courier New, Courier, monospace;
  display: flex;
}

.tile-card {
  box-sizing: border-box;
  background-color: #fff;
  border: 4px solid #4a148c;
  border-radius: 8px;
  width: 350px;
  height: 350px;
  position: relative;
  overflow: hidden;
  box-shadow: 5px 5px #4a148c;
}

.tile-header {
  color: #fff;
  background-color: #4a148c;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: bold;
  display: flex;
}

.nav-link {
  color: #ff80ab;
  margin-left: 8px;
  text-decoration: none;
}

.nav-link:hover {
  color: #fff;
  text-decoration: underline;
}

.tile-body {
  box-sizing: border-box;
  background-image: radial-gradient(#ff80ab 1px, #0000 1px);
  background-size: 10px 10px;
  height: calc(100% - 32px);
  padding: 12px;
}

.bio-box {
  color: #333;
  background-color: #ffffffe6;
  border: 2px dashed #4a148c;
  border-radius: 4px;
  height: 120px;
  padding: 8px;
  font-size: 11px;
  line-height: 1.4;
  overflow-y: scroll;
}

.bio-box::-webkit-scrollbar {
  width: 8px;
}

.bio-box::-webkit-scrollbar-track {
  background: #f1f1f1;
}

.bio-box::-webkit-scrollbar-thumb {
  background: #4a148c;
  border-radius: 4px;
}
</style>
</head>
<body>

    <div class="tile-card">
    
    <div class="tile-header">
        <span class="header-title">★ MY SPACE ★</span>
        <div class="header-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="https://webtiles.kicya.net/t/floof192.nekoweb.org/about.html" class="nav-link">About</a>
        </div>
    </div>

</div>
<div class="tile-body">
        
        <div class="bio-box">
            <p><strong>Hello visitor!</strong> Welcome to my little corner of the WebTiles grid.</p>
            
            <p>text here one day</p>
        </div>


</div>
</body>
</html>
