<!doctype html>
<html>
  <head>
    
    
    <style>.tile-body {
  margin: 0;
  padding: 0;
  font-family: Courier New, Courier, monospace;
}

.tile-bg {
  background-color: #f89e6b;
  background-image: radial-gradient(#f58240 1px, #0000 1px);
  background-size: 12px 12px;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
}

.tile-card {
  box-sizing: border-box;
  background-color: #fbeeea;
  border: 4px solid #33272a;
  border-radius: 8px;
  width: 90%;
  height: 90%;
  position: absolute;
  top: 50%;
  left: 50%;
  overflow: hidden;
  transform: translate(-50%, -50%);
  box-shadow: 5px 5px #33272a80;
}

.tile-header {
  color: #fbeeea;
  box-sizing: border-box;
  background-color: #33272a;
  justify-content: space-between;
  align-items: center;
  height: 34px;
  padding: 0 12px;
  font-size: 12px;
  font-weight: bold;
  display: flex;
}

.header-title {
  white-space: nowrap;
  padding-right: 8px;
}

.header-icon-btn {
  cursor: pointer;
  opacity: .8;
  justify-content: center;
  align-items: center;
  margin-right: -2px;
  text-decoration: none;
  transition: opacity .2s;
  display: flex;
}

.header-icon-btn:hover {
  opacity: 1;
}

.header-x-img {
  width: 25px;
  height: 25px;
  display: block;
}

.tile-body {
  box-sizing: border-box;
  background-color: #fbeeea;
  height: calc(100% - 34px);
  padding: 12px;
}

.bio-box {
  box-sizing: border-box;
  color: #333;
  background-color: #fbeeea;
  border: 2px dashed #33272a;
  border-radius: 6px;
  height: 100%;
  padding: 10px;
  font-size: 11px;
  line-height: 1.4;
  overflow-y: scroll;
}

.bio-box::-webkit-scrollbar {
  width: 8px;
}

.bio-box::-webkit-scrollbar-track {
  background: #fbeeea;
}

.bio-box::-webkit-scrollbar-thumb {
  background: #799f68;
  border-radius: 4px;
}
</style>
  </head>
  <body>
    <div class="tile-bg">
      <div class="tile-card">
        <div class="tile-header">
          <span class="header-title">★ Dreamsicle Tile ★</span>

          <a href="https://floof192.nekoweb.org/" class="header-icon-btn" title="Close / Home" target="_blank">
            <img               src="https://webtiles.kicya.net/t/floof192.nekoweb.org/littlex.png"
              alt="Close"
              class="header-x-img"
            >
          </a>
        </div>

        <div class="tile-body">
          <div class="bio-box">
            <p>
              <strong>Hello visitor!</strong> Welcome to my little corner of the
              WebTiles grid.
            </p>

            <img               src="images/popcat.gif"
              alt="cat"
            >

            <p>Tile claimed 5/27/2026</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
