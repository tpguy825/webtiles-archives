<!DOCTYPE html>
<html lang="en">
<head>
    <style>* {
  margin: 0;
  padding: 0;
}

@font-face {
  font-family: daisywheel;
  src: url("https://webtiles.kicya.net/t/lelbois.nekoweb.org/blocked");
}

.tile-body {
  color: #9ddbf4;
  cursor: crosshair;
  background-color: #c1e1c1;
  font-family: daisywheel;
}

a {
  color: #9ddbf4;
}

a:hover {
  background-color: #efefef;
}

p {
  margin-bottom: 10px;
}

.main {
  background-color: #fff;
  width: 700px;
  height: 900px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.header {
  box-sizing: border-box;
  background-image: url("https://webtiles.kicya.net/t/lelbois.nekoweb.org/blocked");
  background-position: center;
  background-size: cover;
  width: 680px;
  height: 200px;
  margin-top: 10px;
  margin-left: 10px;
}

.stars {
  z-index: 1;
  background-image: url("https://webtiles.kicya.net/t/lelbois.nekoweb.org/blocked");
  width: 150px;
  height: 128px;
  margin-top: -75px;
  margin-left: 550px;
  position: absolute;
}

.bar {
  box-sizing: border-box;
  background-image: url("https://webtiles.kicya.net/t/lelbois.nekoweb.org/blocked");
  align-content: center;
  width: 680px;
  height: 50px;
  margin-top: 10px;
  margin-left: 10px;
}

.bar a {
  color: #000;
  margin-left: 30px;
  text-decoration: none;
}

.bar a:hover {
  color: #fff;
}

.side {
  box-sizing: border-box;
  background-image: url("https://webtiles.kicya.net/t/lelbois.nekoweb.org/blocked");
  background-size: contain;
  width: 250px;
  height: 353px;
  margin-top: 10px;
  margin-left: 10px;
  position: absolute;
}

h1 {
  font-family: daisywheel;
}

.text {
  align-content: center;
  width: 413px;
  height: 353px;
  margin-top: 10px;
  margin-left: 275px;
  position: absolute;
  overflow: auto;
}

.panda {
  background-image: url("https://webtiles.kicya.net/t/lelbois.nekoweb.org/blocked");
  width: 150px;
  height: 257px;
  margin-top: 355px;
  margin-left: 540px;
  position: absolute;
}

.left {
  box-sizing: border-box;
  border: 1px solid #9ddbf4;
  align-content: center;
  width: 225px;
  height: 240px;
  margin-top: 375px;
  margin-left: 10px;
  padding: 10px;
  position: absolute;
  overflow: auto;
}

.right {
  float: right;
  box-sizing: border-box;
  border: 1px solid #9ddbf4;
  align-content: center;
  width: 225px;
  height: 240px;
  margin-top: 375px;
  margin-left: 250px;
  padding: 10px;
  position: absolute;
  overflow: auto;
}
</style>
</head>
<body>
<h1>
    
 <strong>eyyyyyyy</strong>   </h1>
</body>
</html>
