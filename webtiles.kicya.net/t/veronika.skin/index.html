    <style>@font-face {
  font-family: Willow;
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: local(willow), local(willow), url("fonts/willow-500.woff2") format("woff2");
}

@font-face {
  font-family: Gothic Pixels;
  font-style: normal;
  font-weight: 500;

  color: #77604a;

  margin-right: auto;
  display: block;
}

  text-align: center;
  text-transform: capitalize;

#title a {
  color: #fff;
}

a {
  color: #77604a;
  text-decoration: none;
}

a:hover {
  text-decoration: underline wavy;
}

#links {
  border: 14px solid #0000;
  border-image: url("images/lace_peach.png") 14 fill round;
  width: 80%;
  margin: 0 auto;
  padding: 6px;
  animation: none;
}

#links li {
  margin-left: -28px;
  padding-top: 1px;
  padding-bottom: 1px;
  padding-left: 8px;
  list-style-type: ">";
}

  margin: 0;
}
