<!DOCTYPE html>
<html lang="en">
<head>
    <style>.tile-body {
  color: #111;
  background-color: #0f2dff;
  margin: 0;
}

html, .tile-body {
  z-index: -2;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.content {
  animation: 4s linear infinite ratAtion;
}

@keyframes ratAtion {
  0% {
    rotate: none;
  }

  80% {
    rotate: 359deg;
  }

  100% {
    rotate: 360deg;
  }
}

#bg {
  z-index: -1;
  background-image: url("rect2.jpg");
  background-repeat: repeat;
  background-size: 256px;
  width: 100%;
  height: 100%;
  animation: 8s linear infinite bg-scroll-diagonal;
  position: fixed;
  top: 0;
  left: 0;
}

@keyframes bg-scroll-diagonal {
  from {
    background-position: 512px 512px;
  }

  to {
    background-position: 0 0;
  }
}

p {
  text-align: right;
  color: #fff;
  z-index: 100;
  padding: 80% 10px 10px;
}

.content {
  z-index: -1;
  position: absolute;
}
</style>
</head>

    	</div>
