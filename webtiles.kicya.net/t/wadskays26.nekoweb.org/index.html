<!DOCTYPE html>
<html lang="en">
<head>
    <style>.tile-body {
  color: #111;
  background-color: #f0f0f0;
  margin: 10px;
}
</style>
</head>
<body>
    <p>some sort of windows media player visualiser wip</p>
    <canvas id="cv" width="250" height="250"></canvas>
    <script type="text/tilescript">var cv = document.getElementById("cv");
var c  = cv.getContext('2d');
var w = cv.width
var h = cv.height

var size = 10
var scrW = w / size;
var scrH = h / size;
var gird = new Array((scrW * scrH));
var dot = new Array((scrW * scrH));

for (var i = 0; i<dot.length; i++) {
    dot[i] = 0    
}

var errorText = '';

// 1 = exist, 2 = exist and changed
//dot[0] = 2
dot[0] = [Math.floor(scrW*scrH/2), 2]

function runCheck() {
    try {
        loop()
    } catch(e) {
        errorText = "Error running: " + e;
    }
}

var debugColors = true;
function loop() {
    c.textBaseline = 'top'
    c.fillText("is this working?",0,0)
   c.clearRect(0,0,w,h)
    
    // update
	for (var i = 0; i<dot.length; i++) {
        //if (Math.random() > 0.05) break;
        var xy = dot[i][0];
        var d = dot[i][1];
        if (d == 2) {
            dot[i][1] = 2
        } else if (d == 1) {
            dot[i][1] = 0
        }
        
        dot[i + w + 1] = [xy - scrW - 1]
    };
    if (dot.length > scrW*scrH) {
        var excessiveItems = dot.length - scrW*scrH
        for (var i = 0; i < excessiveItems; i ++) {
            dot.pop()
        }
    }

    //  draw
    for (var i = 0; i<dot.length; i++) {
        //console.log(i)
        var xy = dot[i][0];
        var d  = dot[i][1];
        if(d > 0) {
            c.fillStyle = "#000";
            if (debugColors) {
                if (d == 2)
                	c.fillStyle = "#555";
            }
            
            var x = Math.floor(xy % scrW);
            var y = Math.floor(xy / scrH)
            c.fillRect(x,y, size,size)
        }
    };
    
    c.fillStyle = "#F00";
    c.fillText(errorText, 0,0)
    
    runCheck()
}

runCheck()</script>
</body>
</html>
