<!doctype html>
<html lang="ru">
<head>



</head>
<body>
<style>* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, .tile-body {
  color: #f5f1e8;
  background: #0a0a0a;
  width: 250px;
  height: 250px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  overflow: hidden;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
}

.tile {
  background: #0a0a0a;
  border: 1px solid #25221d;
  width: 250px;
  height: 250px;
  position: relative;
  overflow: hidden;
}

.cover {
  object-fit: cover;
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
}

.shade {
  background: linear-gradient(#0000001a, #00000047 42%, #000000e0);
  position: absolute;
  inset: 0;
}

.open {
  color: #f5f1e8;
  letter-spacing: .14em;
  text-transform: uppercase;
  background: #0a0a0a8c;
  border: 1px solid #f5f1e88c;
  padding: 7px 8px;
  font-size: 9px;
  line-height: 1;
  text-decoration: none;
  position: absolute;
  top: 10px;
  right: 10px;
}

.play {
  color: #050505;
  background: #f5f1e8eb;
  border: 1px solid #f5f1e8db;
  place-items: center;
  width: 54px;
  height: 54px;
  font-size: 18px;
  line-height: 1;
  display: grid;
  position: absolute;
  top: 47%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.tile.is-playing .play, .play:hover {
  background: #fc0;
  border-color: #fc0;
}

.nav {
  color: #f5f1e8;
  background: #0a0a0a8c;
  border: 1px solid #f5f1e88c;
  place-items: center;
  width: 28px;
  height: 28px;
  font-size: 12px;
  line-height: 1;
  display: grid;
  position: absolute;
  top: 47%;
  transform: translateY(-50%);
}

.nav:hover {
  color: #050505;
  background: #fc0;
  border-color: #fc0;
}

.prev {
  left: 67px;
}

.next {
  right: 67px;
}

.info {
  gap: 8px;
  display: grid;
  position: absolute;
  bottom: 13px;
  left: 12px;
  right: 12px;
}

.artist {
  color: #b8b0a2;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-size: 8px;
  line-height: 1;
}

.title {
  white-space: nowrap;
  text-overflow: ellipsis;
  text-shadow: 0 1px 16px #00000080;
  min-width: 0;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
  overflow: hidden;
}

.controls {
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 8px;
  display: grid;
}

.status {
  color: #fc0;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-size: 8px;
  line-height: 1;
}

.volume {
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  background: none;
  width: 100%;
  height: 18px;
}

.volume::-webkit-slider-runnable-track {
  background: #f5f1e84d;
  height: 2px;
}

.volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  background: #fc0;
  width: 7px;
  height: 13px;
  margin-top: -5.5px;
}
</style>

<div class="tile" id="tile">
  <img class="cover" id="cover" src="https://webtiles.kicya.net/t/0entropy.top/assets/cp-cover.jpg" alt>
  <div class="shade"></div>
  <audio id="audio" preload="metadata"></audio>
  <a class="open" href="https://0entropy.top/" target="_blank">site</a>
  <button class="nav prev" id="prev" type="button" aria-label="Previous track">&#9664;</button>
  <button class="play" id="play" type="button" aria-label="Play">&#9654;</button>
  <button class="nav next" id="next" type="button" aria-label="Next track">&#9654;</button>
  <div class="info">
    <div class="artist">Daniel Khakimov</div>
    <div class="title" id="title">Connecting People</div>
    <div class="controls">
      <div class="status" id="status">ready</div>
      <input class="volume" id="volume" type="range" min="0" max="100" value="70" aria-label="Volume" autocomplete="off">
    </div>
  </div>
</div>

<script type="text/tilescript">window.TILE_TRACKS = [
  {
    title: "Connecting People",
    file: "assets/1.ogg",
    cover: "assets/1.jpg"
  },
  {
    title: "Dissolve",
    file: "assets/dissolve.mp3",
    cover: "assets/dissolve.png"
  },
  {
    title: "Stairs",
    file: "assets/stairs.mp3",
    cover: "assets/stairs.jpg"
  }
];
</script>
<script type="text/tilescript">
var tile=document.getElementById("tile");
var audio=document.getElementById("audio");
var cover=document.getElementById("cover");
var title=document.getElementById("title");
var play=document.getElementById("play");
var prev=document.getElementById("prev");
var next=document.getElementById("next");
var statusEl=document.getElementById("status");
var volume=document.getElementById("volume");
var tracks=window.TILE_TRACKS||[
  {title:"Connecting People",file:"assets/connecting-people.mp3",cover:"assets/cp-cover.jpg"}
];
var current=0;
var loaded=false;

function currentTrack(){
  return tracks[current]||tracks[0];
}

function setTrack(index,autoplay){
  current=(index+tracks.length)%tracks.length;
  var track=currentTrack();
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  loaded=false;
  cover.src=track.cover;
  title.textContent=track.title;
  stopUi("ready");
  if(autoplay)playCurrent();
}

function loadAudio(){
  if(loaded)return;
  audio.src=currentTrack().file;
  audio.volume=Number(volume.value)/100;
  audio.load();
  loaded=true;
}

function stopUi(text){
  tile.classList.remove("is-playing");
  play.innerHTML="&#9654;";
  statusEl.textContent=text;
}

function playCurrent(){
  if(audio.paused){
    loadAudio();
    statusEl.textContent="load";
    audio.play().then(function(){
      tile.classList.add("is-playing");
      play.innerHTML="&#9632;";
      statusEl.textContent="play";
    }).catch(function(){
      stopUi("n/a");
    });
  }else{
    audio.pause();
    stopUi("pause");
  }
}

play.addEventListener("click",playCurrent);

prev.addEventListener("click",function(){
  setTrack(current-1,true);
});

next.addEventListener("click",function(){
  setTrack(current+1,true);
});

volume.addEventListener("input",function(){
  audio.volume=Number(volume.value)/100;
});

audio.addEventListener("ended",function(){setTrack(current+1,true)});
audio.addEventListener("error",function(){stopUi("n/a")});
setTrack(0,false);
</script>
</body>
</html>
