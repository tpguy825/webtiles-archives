<!doctype html>
<html lang="ru">
<head>



</head>
<body>
<style>* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, .tile-body {
  color: #f5f1e8;
  background: #0a0a0a;
  width: 250px;
  height: 250px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  overflow: hidden;
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
}

.tile {
  background: #0a0a0a;
  border: 1px solid #25221d;
  width: 250px;
  height: 250px;
  position: relative;
  overflow: hidden;
}

.cover {
  object-fit: cover;
  z-index: 0;
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
}

.shade {
  z-index: 1;
  background: linear-gradient(#0000001f, #00000057 42%, #000000e6);
  position: absolute;
  inset: 0;
}

.open {
  z-index: 3;
  color: #f5f1e8;
  letter-spacing: .14em;
  text-transform: uppercase;
  background: #0a0a0a8c;
  border: 1px solid #f5f1e88c;
  padding: 7px 8px;
  font-size: 9px;
  line-height: 1;
  text-decoration: none;
  position: absolute;
  top: 10px;
  right: 10px;
}

.info {
  z-index: 3;
  gap: 8px;
  display: grid;
  position: absolute;
  bottom: 13px;
  left: 12px;
  right: 12px;
}

.artist {
  color: #b8b0a2;
  letter-spacing: .16em;
  text-transform: uppercase;
  font-size: 8px;
  line-height: 1;
}

.title {
  white-space: nowrap;
  text-overflow: ellipsis;
  text-shadow: 0 1px 16px #00000080;
  min-width: 0;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
  overflow: hidden;
}

.nav-row {
  grid-template-columns: 28px 1fr 28px;
  align-items: center;
  gap: 8px;
  display: grid;
}

.nav {
  color: #f5f1e8;
  background: #0a0a0a8c;
  border: 1px solid #f5f1e88c;
  place-items: center;
  height: 24px;
  font-size: 11px;
  line-height: 1;
  display: grid;
}

.nav:hover {
  color: #050505;
  background: #fc0;
  border-color: #fc0;
}

.status {
  color: #fc0;
  letter-spacing: .14em;
  text-align: center;
  text-transform: uppercase;
  font-size: 8px;
  line-height: 1;
}

audio {
  z-index: 4;
  accent-color: #fc0;
  opacity: .01;
  width: 34px;
  height: 24px;
  display: block;
  position: absolute;
  top: 12px;
  left: 12px;
}

.custom-player {
  grid-template-columns: 32px 1fr;
  align-items: center;
  gap: 8px;
  display: grid;
}

.main-play {
  color: #050505;
  background: #f5f1e8eb;
  border: 1px solid #f5f1e8db;
  place-items: center;
  width: 32px;
  height: 32px;
  font-size: 12px;
  line-height: 1;
  display: grid;
}

.main-play:hover, .main-play.is-on {
  background: #fc0;
  border-color: #fc0;
}

.fake-bar {
  background: #f5f1e84d;
  height: 2px;
  overflow: hidden;
}

.fake-fill {
  background: #fc0;
  width: 0%;
  height: 100%;
}
</style>

<div class="tile">
  <img class="cover" id="cover" src="cp-cover.jpg" alt>
  <div class="shade"></div>
  <a class="open" href="https://0entropy.top/" target="_blank">site</a>

  <div class="info">
    <div class="artist">Daniel Khakimov</div>
    <div class="title" id="title">Connecting People</div>
    <audio id="audio" controls preload="metadata" src="connecting-people.mp3"></audio>
    <div class="custom-player">
      <button class="main-play" id="play" type="button" aria-label="Play">&#9654;</button>
      <div class="fake-bar"><div class="fake-fill" id="fill"></div></div>
    </div>
    <div class="nav-row">
      <button class="nav" id="prev" type="button" aria-label="Previous track">&#9664;</button>
      <div class="status" id="status">01 / 03</div>
      <button class="nav" id="next" type="button" aria-label="Next track">&#9654;</button>
    </div>
  </div>
</div>

<script type="text/tilescript">
var tracks=[
  {title:"Connecting People",file:"connecting-people.mp3",cover:"cp-cover.jpg"},
  {title:"Dissolve",file:"dissolve.mp3",cover:"dissolve.png"},
  {title:"Stairs",file:"stairs.mp3",cover:"stairs.jpg"}
];
var current=0;
var audio=document.getElementById("audio");
var cover=document.getElementById("cover");
var title=document.getElementById("title");
var statusEl=document.getElementById("status");
var prev=document.getElementById("prev");
var next=document.getElementById("next");
var play=document.getElementById("play");
var fill=document.getElementById("fill");
var isPlaying=false;
var progressTimer=null;

function pad(n){return n<10?"0"+n:String(n)}

function updateProgress(){
  if(!audio.duration)return;
  fill.style.width=(audio.currentTime/audio.duration*100)+"%";
}

function startProgress(){
  if(progressTimer)return;
  progressTimer=setInterval(updateProgress,250);
}

function stopProgress(){
  if(!progressTimer)return;
  clearInterval(progressTimer);
  progressTimer=null;
}

function setPlayUi(on){
  isPlaying=on;
  play.innerHTML=on?"&#9632;":"&#9654;";
  if(on){
    play.classList.add("is-on");
    startProgress();
  }else{
    play.classList.remove("is-on");
    stopProgress();
  }
}

function setTrack(index){
  var resume=isPlaying;
  current=(index+tracks.length)%tracks.length;
  var track=tracks[current];
  audio.pause();
  audio.src=track.file;
  audio.load();
  cover.src=track.cover;
  title.textContent=track.title;
  statusEl.textContent=pad(current+1)+" / "+pad(tracks.length);
  setPlayUi(false);
  fill.style.width="0%";
  if(resume){
    audio.play();
    setPlayUi(true);
  }
}

play.addEventListener("click",function(){
  if(!isPlaying){
    audio.play();
    setPlayUi(true);
  }else{
    audio.pause();
    setPlayUi(false);
  }
});
prev.addEventListener("click",function(){setTrack(current-1)});
next.addEventListener("click",function(){setTrack(current+1)});
audio.addEventListener("ended",function(){setTrack(current+1)});
audio.addEventListener("loadedmetadata",updateProgress);
audio.addEventListener("timeupdate",function(){
  updateProgress();
});
audio.addEventListener("pause",function(){
  setPlayUi(false);
});
audio.addEventListener("play",function(){
  setPlayUi(true);
});
</script>
</body>
</html>
