<!DOCTYPE html>
<html lang="en">
<head>
    <style>*, :after, :before {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.tile-body {
  color: #fff;
  background-image: url("right-side-darkened.webp");
  background-size: contain;
  width: 100%;
  height: 100%;
  padding: 25px 10px 10px;
  font-family: serif;
}

p {
  font-family: sans-serif;
  font-size: 16px;
}

h1 {
  margin-top: 32px;
}

p, h1 {
  will-change: filter;
  filter: drop-shadow(1px 1px #000) drop-shadow(-1px 1px #000) drop-shadow(1px -1px #000) drop-shadow(-1px -1px #000);
}

a {
  color: #fff;
  text-decoration: none;
}

a:hover {
  filter: drop-shadow(1px 1px #808) drop-shadow(-1px 1px #808) drop-shadow(1px -1px #808) drop-shadow(-1px -1px #808);
  text-decoration: underline;
}
</style>
</head>
